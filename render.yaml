# Blueprint de Render para el backend (NestJS). El frontend va en Vercel.
services:
  - type: web
    name: habitat-capital-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false   # pégala en el panel de Render (cadena de MongoDB Atlas)
      - key: FRONTEND_URL
        sync: false   # URL de Vercel, ej: https://habitat-capital.vercel.app
      - key: SEED
        value: "true"
